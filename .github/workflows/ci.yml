name: CI Pipeline

on:
  push:
    branches: [main, master, "feature/**", "refactor/**"]
  pull_request:
    branches: [main, master]

jobs:
  backend-build-test:
    name: Backend Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore Backend
        run: dotnet restore src/backend/TutorHub.sln

      - name: Build Solution (TreatWarningsAsErrors=true)
        run: dotnet build src/backend/TutorHub.sln --no-restore

      - name: Run Domain Unit Tests
        run: dotnet test src/test/TutorHub.Domain.UnitTests/TutorHub.Domain.UnitTests.csproj --no-build

      - name: Run Application Unit Tests
        run: dotnet test src/test/TutorHub.Application.UnitTests/TutorHub.Application.UnitTests.csproj --no-build

      - name: Run Infrastructure Unit Tests
        run: dotnet test src/test/TutorHub.Infrastructure.UnitTests/TutorHub.Infrastructure.UnitTests.csproj --no-build

  frontend-build-lint:
    name: Frontend Lint, Build & Contract Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Lint Frontend (0 Warnings Allowed)
        working-directory: src/frontend
        run: npm run lint

      - name: Build Frontend
        working-directory: src/frontend
        run: npm run build

      - name: Verify API Contract & Zero-Mock Policy
        run: node scripts/verify-frontend-api-contract.mjs

  secret-scan:
    name: Secrets & Credentials Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Secret Scanner
        shell: pwsh
        run: ./scripts/scan-secrets.ps1
