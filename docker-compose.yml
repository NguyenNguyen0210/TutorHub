# Fixed project name: Compose otherwise derives it from the checkout directory, so a
# second working copy (e.g. ./TutorHub vs ./TutorHub-frontend) becomes a *different*
# project that collides on the fixed container_name and creates a second empty pgdata
# volume. Pinning the name makes both checkouts share one stack.
name: tutorhub

services:
  postgres:
    image: postgres:16-alpine
    container_name: tutorhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tutorhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tutorhub}
      POSTGRES_DB: ${POSTGRES_DB:-tutorhub}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tutorhub} -d ${POSTGRES_DB:-tutorhub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: tutorhub-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      # Defaults to Production (fail-fast on missing configuration). Set Development
      # in .env to run the container for local dev: Swagger, log-only email and the
      # Development CORS defaults. Has no effect on `dotnet run`.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-tutorhub};Username=${POSTGRES_USER:-tutorhub};Password=${POSTGRES_PASSWORD:-tutorhub}
      # A fresh pgdata volume has no schema, and nothing else applies migrations.
      # Gated flag, off by default everywhere except this container.
      Database__MigrateOnStartup: "true"
      Jwt__Secret: ${Jwt__Secret}
      Jwt__Issuer: ${Jwt__Issuer:-TutorHubAPI}
      Jwt__Audience: ${Jwt__Audience:-TutorHubClient}
      Jwt__AccessTokenExpirationMinutes: 15
      Jwt__RefreshTokenExpirationDays: 7
      # Required by RefreshTokenOptions (P0-D1): refresh tokens are stored hashed.
      RefreshToken__Pepper: ${RefreshToken__Pepper}
      VnPay__TmnCode: ${VnPay__TmnCode:-TUTORHUB}
      VnPay__HashSecret: ${VnPay__HashSecret}
      VnPay__BaseUrl: ${VnPay__BaseUrl:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VnPay__ReturnUrl: ${VnPay__ReturnUrl:-http://localhost:8080/api/v1/payments/vnpay/return}
      CloudflareR2__AccountId: ${CloudflareR2__AccountId}
      CloudflareR2__BucketName: ${CloudflareR2__BucketName:-tutorhub-media}
      CloudflareR2__AccessKeyId: ${CloudflareR2__AccessKeyId}
      CloudflareR2__SecretAccessKey: ${CloudflareR2__SecretAccessKey}
      # Amazon SES (P0-E1). Outside Development an unset sender address stops startup
      # instead of silently logging email away; in Development the container falls back
      # to the log-only sender. Credentials follow the standard AWS chain: these two
      # variables, or an instance role.
      Ses__Region: ${Ses__Region}
      Ses__FromAddress: ${Ses__FromAddress}
      Ses__FromDisplayName: ${Ses__FromDisplayName:-TutorHub}
      Ses__ConfigurationSetName: ${Ses__ConfigurationSetName:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      # Browser origins allowed to call the API (P0-E2). Comma-separated for more
      # than one; the container is not Development, so an empty list stops startup.
      Cors__AllowedOrigins: ${Cors__AllowedOrigins}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot loader. Waits for the api service to create the schema, then loads
  # src/backend/seedData.sql ONLY while the database is still empty — so a repeat
  # `docker compose up` never wipes existing domain data (seedData.sql TRUNCATEs).
  seed:
    image: postgres:16-alpine
    container_name: tutorhub-seed
    restart: "no"
    depends_on:
      api:
        condition: service_started
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-tutorhub}
      PGUSER: ${POSTGRES_USER:-tutorhub}
      PGDATABASE: ${POSTGRES_DB:-tutorhub}
    volumes:
      - ./src/backend/seedData.sql:/seed/seedData.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "[seed] waiting for database migrations to complete..."
        until psql -h postgres -tAc "select to_regclass('public.\"__EFMigrationsHistory\"')" 2>/dev/null | grep -q __EFMigrationsHistory && \
              psql -h postgres -tAc "select count(*) from \"__EFMigrationsHistory\" where \"MigrationId\" = '20260914142220_AddAccountLockout'" 2>/dev/null | grep -q 1; do
          sleep 2
        done
        count=$$(psql -h postgres -tAc 'select count(*) from "Users"')
        if [ "$$count" = "0" ]; then
          echo "[seed] database is empty -> loading seedData.sql"
          psql -h postgres -v ON_ERROR_STOP=1 -q -f /seed/seedData.sql
          echo "[seed] seedData.sql loaded successfully"
        else
          echo "[seed] skipped: $$count user(s) already present"
        fi

volumes:
  pgdata:
