services:
  postgres:
    image: postgres:16-alpine
    container_name: tutorhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tutorhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tutorhub}
      POSTGRES_DB: ${POSTGRES_DB:-tutorhub}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tutorhub} -d ${POSTGRES_DB:-tutorhub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tutorhub-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-tutorhub};Username=${POSTGRES_USER:-tutorhub};Password=${POSTGRES_PASSWORD:-tutorhub}
      Jwt__Secret: ${JWT_SECRET:-super_secret_jwt_key_tutorhub_platform_minimum_32_characters_long_2026!}
      Jwt__Issuer: TutorHubAPI
      Jwt__Audience: TutorHubClient
      Jwt__AccessTokenExpirationMinutes: 15
      Jwt__RefreshTokenExpirationDays: 7
      VnPay__TmnCode: ${VNPAY_TMN_CODE:-TUTORHUB}
      VnPay__HashSecret: ${VNPAY_HASH_SECRET:-}
      VnPay__BaseUrl: ${VNPAY_BASE_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VnPay__ReturnUrl: ${VNPAY_RETURN_URL:-http://localhost:5000/api/v1/payments/vnpay/return}
      CloudflareR2__AccountId: ${CLOUDFLARE_R2_ACCOUNT_ID:-}
      CloudflareR2__BucketName: ${CLOUDFLARE_R2_BUCKET_NAME:-tutorhub-media}
      CloudflareR2__AccessKeyId: ${CLOUDFLARE_R2_ACCESS_KEY_ID:-}
      CloudflareR2__SecretAccessKey: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
